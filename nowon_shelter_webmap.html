}).addTo(map);

const CLASS_COLORS = ['#f7fbff', '#d1e2f3', '#9ac8e0', '#529dcc', '#1d6cb1', '#08306b'];
const CLASS_LABELS = ['0.1289 - 0.1594', '0.1594 - 0.2342', '0.2342 - 0.2903', '0.2903 - 0.3294', '0.3294 - 0.3974', '0.3974 - 0.5268'];

// ---------- 4. GeoJSON 레이어 ----------
const allMarkers = [];  // 필터 슬라이더에서 마커를 다시 찾기 위한 저장소

const suitabilityLayer = L.geoJSON(geojsonData, {
  pointToLayer: function (feature, latlng) {
    const val = feature.properties.suitability;
    const marker = L.circleMarker(latlng, {
      radius: 8,
      fillColor: CLASS_COLORS[feature.properties.cls],
      color: '#333',
      weight: 1,
      opacity: 1,
      fillOpacity: 0.85
    });
    allMarkers.push({ marker: marker, value: val });
    return marker;
  },
  onEachFeature: function (feature, layer) {
    const val = feature.properties.suitability;
    layer.bindPopup(`<b>적합도(suitability)</b>: ${val.toFixed(3)}`);
  }
}).addTo(map);

// 데이터 범위에 맞춰 지도 시점을 자동으로 맞춤
map.fitBounds(suitabilityLayer.getBounds(), { padding: [20, 20] });

// ---------- 5. 범례 ----------
const legend = L.control({ position: 'bottomright' });
legend.onAdd = function () {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML =
    '<b>입지 적합도</b>' +
    CLASS_COLORS.map((c, i) =>
      `<div><i style="background:${c}"></i>${CLASS_LABELS[i]}</div>`).join('');
  return div;
};
legend.addTo(map);

// ---------- 6. 필터 슬라이더 ----------
const SLIDER_MIN = Math.floor(V_MIN * 20) / 20;   // 0.05 단위로 내림
const SLIDER_MAX = Math.ceil(V_MAX * 20) / 20;    // 0.05 단위로 올림
const filterControl = L.control({ position: 'topright' });
filterControl.onAdd = function () {
  const div = L.DomUtil.create('div', 'filter-control');
  div.innerHTML =
    '<b>적합도 필터</b><br>' +
    `기준값 이상만 강조: <span class="value" id="filterValue">${SLIDER_MIN.toFixed(2)}</span><br>` +
    `<input type="range" id="filterSlider" min="${SLIDER_MIN}" max="${SLIDER_MAX}" step="0.01" value="${SLIDER_MIN}">`;
  L.DomEvent.disableClickPropagation(div);
  return div;
};
filterControl.addTo(map);

document.getElementById('filterSlider').addEventListener('input', function (e) {
  const threshold = parseFloat(e.target.value);
  document.getElementById('filterValue').textContent = threshold.toFixed(2);

  allMarkers.forEach(function (item) {
    if (item.value >= threshold) {
      item.marker.setStyle({ fillOpacity: 0.85, opacity: 1 });      // 기준값 이상: 진하게
    } else {
      item.marker.setStyle({ fillOpacity: 0.05, opacity: 0.1 });    // 기준값 미만: 거의 투명하게
    }
  });
});

// ---------- 7. 레이어 켜기/끄기 ----------
const layerToggleControl = L.control({ position: 'topleft' });
layerToggleControl.onAdd = function () {
  const div = L.DomUtil.create('div', 'filter-control');
  div.innerHTML =
    '<b>레이어 표시</b><br>' +
    '<label><input type="checkbox" id="toggleSuitability" checked> 적합도 포인트 (P1)</label>';
  L.DomEvent.disableClickPropagation(div);
  return div;
};
layerToggleControl.addTo(map);

document.getElementById('toggleSuitability').addEventListener('change', function (e) {
  if (e.target.checked) { map.addLayer(suitabilityLayer); } else { map.removeLayer(suitabilityLayer); }
});
</script>
</body>
</html>
